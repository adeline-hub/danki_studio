# ===============================
# Configuration Hugoplate
# ===============================
baseURL = "https://dankistudio.netlify.app/"
languageCode = "fr-FR"
title = "Danki Studio"
theme = "hugoplate"
enableRobotsTXT = true
paginate = 10

[params]
  navbar_fixed = true
  theme_switcher = true
  primary_color = "#4f46e5"
  darkmode = true

  # Matches your screenshot "Get A Quote"
  [params.navigation_button]
    enable = true
    label = "Get A Quote"
    link = "/contact/"

  [params.search]
    enable = true

# ===============================
# Multilingue & Markup
# ===============================
[markup.goldmark.renderer]
  unsafe = true # Indispensable pour que le HTML du portfolio s'affiche

[languages]

  # --- ANGLAIS ---
  [languages.en]
    languageName = "English"
    contentDir = "content/en"
    title = "Danki Studio"
    weight = 1
    [[languages.en.menu.main]]
      name = "Data"
      url = "/portfolio/"
      weight = 1
    [[languages.en.menu.main]]
      name = "Home"
      url = "/"
      weight = 2
    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 3
    [[languages.en.menu.main]]
      name = "Blog"
      url = "/blog/"
      weight = 4
    [[languages.en.menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 5

