{{ define "main" }}

<section class="portfolio-grid">
  {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="portfolio-item">
      {{ with .Params.cover }}
        <img src="{{ . | relURL }}" alt="{{ $.Title }}">
      {{ end }}
      <div class="overlay">
        <h2>{{ .Title }}</h2>
      </div>
    </a>
  {{ end }}
</section>

{{ end }}
