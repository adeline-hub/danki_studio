{{ define "main" }}

<section class="mx-auto max-w-7xl px-4 py-16">
  
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-0">

    {{ range .Pages }}
      <a
        href="{{ .RelPermalink }}"
        class="group relative block aspect-square overflow-hidden bg-gray-100"
      >

        {{ with .Params.cover }}
          <img
            src="{{ . | relURL }}"
            alt="{{ $.Title }}"
            class="absolute inset-0 h-full w-full object-cover
                   transition-transform duration-500 ease-out
                   group-hover:scale-105"
            loading="lazy"
          >
        {{ end }}

        <!-- Overlay -->
        <div
          class="absolute inset-0 flex items-center justify-center
                 bg-black/40 opacity-0
                 transition-opacity duration-300
                 group-hover:opacity-100"
        >
          <h2 class="text-white text-xl md:text-2xl font-semibold text-center px-6">
            {{ .Title }}
          </h2>
        </div>

      </a>
    {{ end }}

  </div>

</section>

{{ end }}
