{{ define "main" }}

<section class="mx-auto max-w-7xl px-4 py-16">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-0">

    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="group relative block aspect-square overflow-hidden">

        {{ with .Resources.GetMatch .Params.cover }}
          <img
            src="{{ .RelPermalink }}"
            alt="{{ $.Title }}"
            class="absolute inset-0 h-full w-full object-cover
                   transition-transform duration-500 group-hover:scale-105"
            loading="lazy"
          >
        {{ end }}

        <div class="absolute inset-0 flex items-center justify-center bg-black/50
                    opacity-0 group-hover:opacity-100 transition">
          <h2 class="text-white text-xl font-semibold text-center px-4">
            {{ .Title }}
          </h2>
        </div>

      </a>
    {{ end }}

  </div>
</section>

{{ end }}
