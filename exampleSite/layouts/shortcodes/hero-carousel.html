<!-- Hero Carousel - Slide Queen Style -->
<section class="hero-carousel" style="position: relative; overflow: hidden; min-height: 80vh;">
  
  <!-- Slides Container -->
  <div class="carousel-slides" style="display: flex; transition: transform 0.5s ease-in-out;">
    {{ .Inner }}
  </div>
  
  <!-- Navigation Dots -->
  <div class="carousel-dots" style="position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.75rem; z-index: 10;">
    <button onclick="goToSlide(0)" class="carousel-dot active" style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c4a574; background-color: #c4a574; cursor: pointer;"></button>
    <button onclick="goToSlide(1)" class="carousel-dot" style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c4a574; background-color: transparent; cursor: pointer;"></button>
    <button onclick="goToSlide(2)" class="carousel-dot" style="width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c4a574; background-color: transparent; cursor: pointer;"></button>
  </div>
  
  <!-- Navigation Arrows -->
  <button onclick="prevSlide()" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.8); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; color: #333; z-index: 10;">
    &#8249;
  </button>
  <button onclick="nextSlide()" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.8); border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; color: #333; z-index: 10;">
    &#8250;
  </button>
  
</section>

<!-- Carousel JavaScript -->
<script>
let currentSlide = 0;
const totalSlides = 3;

function updateCarousel() {
  const slides = document.querySelector('.carousel-slides');
  slides.style.transform = `translateX(-${currentSlide * 100}%)`;
  
  // Update dots
  document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
    dot.style.backgroundColor = index === currentSlide ? '#c4a574' : 'transparent';
  });
}

function nextSlide() {
  currentSlide = (currentSlide + 1) % totalSlides;
  updateCarousel();
}

function prevSlide() {
  currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
  updateCarousel();
}

function goToSlide(index) {
  currentSlide = index;
  updateCarousel();
}

// Auto-advance every 6 seconds
setInterval(nextSlide, 6000);
</script>
