<section class="my-24">
  <h2 class="mb-8 text-2xl font-semibold text-center">
    Selected Work
  </h2>

  <div class="grid grid-cols-2 gap-2 md:grid-cols-4">

    {{ range first 8 (where site.RegularPages "Section" "portfolio") }}
      {{ $page := . }}

      {{ with $page.Params.cover }}
        {{ $img := $page.Resources.GetMatch . }}
        {{ if $img }}
          <a href="{{ $page.RelPermalink }}" class="block">
            <img
              src="{{ $img.RelPermalink }}"
              alt="{{ $page.Title }}"
              class="aspect-square w-full object-cover"
              loading="lazy"
              decoding="async"
            >
          </a>
        {{ else }}
          <!-- DEBUG: cover not found for {{ $page.File.Path }} -->
        {{ end }}
      {{ end }}

    {{ end }}

  </div>

  <div class="mt-6 text-center">
    <a href="{{ "/portfolio" | relURL }}" class="text-sm underline">
      View full portfolio →
    </a>
  </div>
</section>
