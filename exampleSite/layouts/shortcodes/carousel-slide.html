<!-- Single Carousel Slide -->
<div class="carousel-slide" style="min-width: 100%; display: flex; align-items: center; padding: 2rem;">
  <div style="max-width: 1200px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 4rem; padding: 0 2rem;">
    
    <!-- Text Content -->
    <div style="flex: 1; max-width: 500px;">
      <h1 style="font-size: 3rem; font-weight: bold; color: #333; margin-bottom: 1rem;">
        {{ .Get "title" }}
      </h1>
      <p style="font-size: 1.25rem; font-weight: 600; color: #333; margin-bottom: 0.5rem;">
        {{ .Get "subtitle" }}
      </p>
      <p style="font-size: 1rem; color: #666; margin-bottom: 1.5rem;">
        {{ .Get "description" }}
      </p>
      {{ if .Get "button_text" }}
      <a 
        href="{{ .Get "button_link" }}" 
        style="display: inline-block; padding: 0.75rem 2rem; background-color: #c4a574; color: white; text-decoration: none; font-weight: 600; border-radius: 4px;"
      >
        {{ .Get "button_text" }}
      </a>
      {{ end }}
    </div>
    
    <!-- Image -->
    <div style="flex: 1; display: flex; justify-content: center;">
      {{ if .Get "image" }}
      <img 
        src="{{ .Get "image" }}" 
        alt="{{ .Get "title" }}" 
        style="max-width: 100%; max-height: 500px; object-fit: contain;"
      />
      {{ end }}
    </div>
    
  </div>
</div>
