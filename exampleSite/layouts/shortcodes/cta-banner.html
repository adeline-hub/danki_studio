<!-- CTA Banner Section -->
<section class="section bg-secondary py-12">
  <div class="container">
    <div class="row items-center justify-between">
      <div class="lg:col-8">
        <h3 class="text-2xl font-bold text-dark mb-2">{{ .Get "title" }}</h3>
        <p class="text-lg text-gray-700">{{ .Get "description" }}</p>
      </div>
      <div class="lg:col-4 text-right">
        <a href="{{ .Get "link" }}" class="btn btn-primary">
          {{ .Get "button_text" }}
        </a>
      </div>
    </div>
  </div>
</section>
