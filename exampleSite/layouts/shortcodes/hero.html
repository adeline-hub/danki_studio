<section class="mx-auto max-w-7xl px-6 py-24 grid gap-16 md:grid-cols-2 items-center">

  <!-- Text -->
  <div>
    {{ .Inner | markdownify }}
  </div>

  <!-- Image -->
  <div>
    <img
      src="{{ .Get "image" }}"
      alt="{{ .Get "alt" }}"
      class="w-full max-w-md mx-auto"
      loading="lazy"
    >
  </div>

</section>
